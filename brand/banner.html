<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;800&display=block">
<style>
html,body{margin:0;width:1500px;height:500px;background:#0b0d10;overflow:hidden}
.bg{position:absolute;inset:0;background:
  repeating-linear-gradient(to bottom, transparent 0 99px, #161a20 99px 100px)}
.noon{position:absolute;left:1248px;top:0;bottom:0;width:4px;background:linear-gradient(#e8a35c00,#e8a35c 30%,#e8a35c 70%,#e8a35c00);opacity:.9}
.text{position:absolute;left:150px;top:150px;font-family:"Libre Franklin","Helvetica Neue",Arial,sans-serif;color:#eceef1}
h1{margin:0;font-weight:800;font-size:104px;line-height:1;letter-spacing:-.025em}
h1 span{color:#e8a35c}
p{margin:22px 0 0;font-weight:500;font-size:29px;color:#9aa1ab;letter-spacing:.01em}
.mark{position:absolute;left:1178px;top:178px;width:144px;height:144px;background:#0b0d10;border-radius:50%}
.mark svg{width:144px;height:144px;display:block}
</style></head><body><div class="bg"></div><div class="noon"></div>
<div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="78" fill="none" stroke="#2a3039" stroke-width="7"/>
  <g stroke="#3a414c" stroke-width="7" stroke-linecap="round">
    <line x1="100" y1="160" x2="100" y2="168"/><line x1="40" y1="100" x2="32" y2="100"/><line x1="160" y1="100" x2="168" y2="100"/>
  </g>
  <line x1="100" y1="100" x2="100" y2="34" stroke="#e8a35c" stroke-width="12" stroke-linecap="round"/>
  <circle cx="100" cy="100" r="10" fill="#e8a35c"/>
</svg></div>
<div class="text"><h1>The Noon <span>Line</span></h1><p>NBA player-points picks · noon ET · every bet tracked</p></div>
</body></html>
