# The daily Noon Line run, in GitHub's cloud. Times are UTC (ET + 4 until Nov 1, + 5 after).
#   picks    12:00 PM ET   noon odds + injury report -> the day's bets -> site and X
#   close    evenings, ~10-20 min before each bet's tip: closing lines for games with a bet
#   results  9:00 AM ET    ESPN box scores -> settle the bets -> site and X
# The Cloudflare Worker's crons start all three on time (worker.js); GitHub's own schedule below is only a late backup
# for picks and results (it often starts hours late). Also runnable by hand from the Actions tab.
name: daily

on:
  schedule:
    - cron: '0 17 * * *'                # picks (backup; the Worker starts it at 12:00 PM ET)
    - cron: '0 13 * * *'                 # results (backup; the Worker starts it at 9:00 AM ET)
  workflow_dispatch:
    inputs:
      mode:
        description: picks, close, results, remove (drop a bet, names in override), explain (add the model breakdown to the current day), announce (post the text in args to X), xauth or xcheck (test the X sign-in, posts nothing)
        required: true
        default: picks
        type: choice
        options: [picks, close, results, remove, explain, announce, xauth, xcheck]
      override:
        description: 'picks: fix a status and rerun, e.g. Luka Doncic=Available. remove: bets to drop, e.g. Daniel Gafford=price moved'
        required: false
        default: ''
      args:
        description: extra arguments for testing, e.g. --replay --date 2026-03-30 --no-deploy
        required: false
        default: ''

concurrency:
  group: belch-bets-pipeline            # one run at a time; a second one waits
  cancel-in-progress: false

permissions:
  contents: write                       # the run commits its data back

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: odds_model
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      X_API_KEY: ${{ secrets.X_API_KEY }}             # posting the day's bets to X (post_x.py); unset = no posts
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}         # or OAuth 2.0 (what X's console issues now); see post_x.py
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
      X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
      X_TOKEN_KEY: ${{ secrets.X_TOKEN_KEY }}
      TZ: America/New_York
    steps:
      - name: Which job
        id: mode
        working-directory: .
        run: |
          if [ -n "${{ inputs.mode }}" ]; then m="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 17 * * *" ]; then m=picks
          elif [ "${{ github.event.schedule }}" = "0 13 * * *" ]; then m=results
          else m=close; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"; echo "Running: $m"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-java@v4
        if: steps.mode.outputs.mode == 'picks'
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: pip install -q -r ../requirements.txt
      - name: Build features from the box scores
        if: steps.mode.outputs.mode != 'close' && steps.mode.outputs.mode != 'announce' && steps.mode.outputs.mode != 'xauth' && steps.mode.outputs.mode != 'xcheck' && steps.mode.outputs.mode != 'remove'
        run: |
          python build_features.py > /dev/null
          python injury_reports.py > /dev/null       # data/noon_injuries.parquet: who was on each game's report (teammates returning)
      - name: Run the pipeline
        env:
          ANNOUNCE: ${{ inputs.args }}            # announce mode: the post's text (read by post_x.py, never put on a command line)
          OVERRIDE: ${{ inputs.override }}        # picks: status overrides (read by daily_pipeline.py --set)
          BACKUP: ${{ github.event_name == 'schedule' && '--if-missing' || '' }}   # GitHub's late backup never redoes a day
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = announce ]; then python post_x.py --announce
          elif [ "${{ steps.mode.outputs.mode }}" = xauth ]; then python post_x.py --authorize
          elif [ "${{ steps.mode.outputs.mode }}" = xcheck ]; then python post_x.py --check
          elif [ "${{ steps.mode.outputs.mode }}" = close ]; then python daily_pipeline.py close --window 20 ${{ inputs.args }}
          elif [ "${{ steps.mode.outputs.mode }}" = picks ]; then python daily_pipeline.py picks $BACKUP ${{ inputs.args }}
          else python daily_pipeline.py ${{ steps.mode.outputs.mode }} ${{ inputs.args }}; fi
      - name: Save the day's data
        if: always()
        working-directory: .
        run: |
          git config user.name "belch-bets-bot"
          git config user.email "belch-bets-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "${{ steps.mode.outputs.mode }} run $(date +%F)"
          git pull -q --rebase && git push -q
