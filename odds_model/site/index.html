<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0d10">
<title>The Noon Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="page">
  <header class="top">
    <nav class="sitenav" aria-label="Site">
      <a class="brand" href="./">The Noon <span>Line</span></a>
      <a href="./" aria-current="page">Today</a><a href="results.html">Results</a><a href="points.html" id="board-link">Board</a>
    </nav>
    <div class="controls">
      <span class="daynav">
        <button class="icon" id="prev" aria-label="Previous day">‹</button>
        <button class="textbtn" id="latest">Latest</button>
        <button class="icon" id="next" aria-label="Next day">›</button>
      </span>
      <a class="textbtn howlink" href="method.html">How it works</a>
    </div>
  </header>

  <div id="banner"></div>
  <div class="intro">
    <p class="small" id="dateline"></p>
    <h1 id="title">Today's bets</h1>
    <p class="sub" id="sub"></p>
  </div>

  <div class="toolbar">
    <div class="seg filter" id="filter" role="group" aria-label="Model"></div>
    <div class="nightsum" id="night"></div>
  </div>

  <div class="blist" id="bets"></div>

  <section class="page-sec" id="tonight-sec" hidden>
    <div class="shead"><h2 id="tonight-h">Tonight's games</h2><p id="tonight-sub"></p></div>
    <div class="games" id="tonight"></div>
  </section>

  <section class="page-sec" id="season-sec">
    <div class="shead"><h2>Season so far</h2><p id="season-sub"></p></div>
    <div class="sstrip" id="season"></div>
    <a class="more" href="results.html">Every bet, by night, and past seasons →</a>
  </section>

  <footer>
    <span>Bets post around noon ET on game days. Results update the next morning. <a href="method.html">How it works</a></span>
    <span>Bet responsibly. Past results don't guarantee future ones.</span>
    <label class="statepick" id="state">Your state, for sportsbook links <select id="state-sel" aria-label="Your state"></select></label>
  </footer>
</div>

<script src="app.js"></script>
<script>
const { $, esc, sgn, odds, cls, cap, longDate, short, weekday, todayET, tipET, seasonOf, getJSON, MODELS, MODEL, marketOf,
        settled, getFilter, filterSeg, book, statePicker, sum, pill, mchip } = NL;
let DATA = null, LATEST = null, LATEST_SITE = null, DATES = [], LEDGER = [], SITE_LEDGER = [];

// Why a model has no bets on the shown day (as the noon X post says)
function noBetsReason(m) {
  if ((DATA.message || '').startsWith('No bets: the site sits out')) return 'the site sits out the last two weeks of the season';
  const board = m === 'points' ? DATA.board : DATA.markets?.[m]?.board;
  if (!(DATA.games || []).length) return 'no games';
  if (!board || !board.length) return `no ${m} lines posted`;
  const top = board.filter(r => r.play !== 'skip');
  return top.length ? `best eligible edge ${sgn(Math.max(...top.map(r => r.edge)) * 100)}%, under the 2% minimum`
                    : 'every prop skipped (injury report, back-to-back)';
}
const result = p => LEDGER.find(b => b.date === DATA.date && b.player === p.player && marketOf(b) === marketOf(p) && b.side === p.side);
const nowTag = p => !p.now ? '' : p.now.valid
  ? `<div class="nowtag ok">Still a bet at ${esc(p.now.at)} odds: ${cap(p.now.side)} ${p.now.line} ${odds(p.now.price)} ${esc(p.now.book)}</div>`
  : `<div class="nowtag gone">Not a bet at ${esc(p.now.at)} odds</div>`;

function betRow(p) {
  const M = MODEL[marketOf(p)], L = result(p), done = L && settled(L.result);
  const stake = p.stake && p.stake !== 1 ? ` <span class="stake">· ${p.stake}u</span>` : '';
  const tip = tipET(p.commence_time);
  return `<div class="brow" data-key="${esc(liveKey(p))}">
    <div><div class="pn">${esc(p.player)}</div><div class="small">${esc(p.team)} vs ${esc(p.opp || p.opponent)}${tip ? ' · ' + tip : ''}</div></div>
    <div class="bet"><div class="bl">${cap(p.side)} ${p.line} ${M.unit}${stake}</div>
      <div class="px"><span class="price">${odds(p.price)}</span>${book(p.book, p.link)}</div>${nowTag(p)}<div class="livetag" hidden></div></div>
    <div class="rs">${pill(done ? L.result : null)}${done ? `<span class="small">${L.points != null ? `${L.points} ${M.unit} · ` : ''}<span class="${cls(L.units)}">${sgn(L.units, 2)}u</span></span>` : ''}</div>
  </div>`;
}

function renderBets() {
  const f = getFilter(), picks = (DATA.picks || []).filter(p => f === 'all' || marketOf(p) === f);
  const show = f === 'all' ? MODELS : [MODEL[f]];
  $('bets').innerHTML = show.map(M => {
    const P = picks.filter(p => marketOf(p) === M.m).sort((a, b) => b.edge - a.edge);
    const head = f === 'all' ? `<div class="ghead"><i class="mdot" style="--mc:var(--m-${M.m})"></i>${M.name}<small>${P.length ? `${P.length} bet${P.length === 1 ? '' : 's'}` : ''}${M.m === 'rebounds' ? ' · unders only' : ''}</small></div>` : '';
    const rows = P.length ? P.map(betRow).join('') : `<div class="brow nobet">No ${M.m} bets: ${esc(noBetsReason(M.m))}.</div>`;
    return head + rows;
  }).join('');
  // the night's total once every shown bet is settled
  const R = picks.map(result).filter(Boolean), allDone = picks.length && R.length === picks.length && R.every(b => settled(b.result));
  const t = sum(R);
  $('night').innerHTML = !picks.length ? '' : allDone
    ? `<span>Night</span><b>${t.wins}–${t.losses}</b><b class="${cls(t.units)}">${sgn(t.units, 2)}u</b>`
    : `<span class="small">${R.filter(b => settled(b.result)).length ? 'Some results in. ' : ''}Results update the next morning.</span>`;
}

function renderHead() {
  const today = todayET(), isLatest = DATA.date === LATEST, picks = DATA.picks || [];
  $('dateline').textContent = longDate(DATA.date);
  $('banner').innerHTML = DATA.status === 'error' ? `<div class="banner">This day's update failed. ${esc(DATA.message)}</div>` : '';
  $('title').textContent = DATA.date === today ? "Today's bets" : isLatest && DATA.date < today ? `${weekday(DATA.date)}'s bets` : `Bets for ${short(DATA.date)}`;
  const n = picks.length, by = MODELS.map(M => [M.name.toLowerCase(), picks.filter(p => marketOf(p) === M.m).length]).filter(x => x[1]);
  const posted = DATA.updated ? ` Posted ${String(DATA.updated).replace(/^\d{4}-\d{2}-\d{2}\s*/, '')}.` : '';
  $('sub').textContent = (n ? `${n} bet${n === 1 ? '' : 's'}: ${by.map(([k, v]) => `${v} ${k}`).join(', ')}.` : 'No bets this day.') + posted +
    (isLatest && DATA.date < today ? " Today's bets post around noon ET." : '');
  const i = DATES.indexOf(DATA.date);
  $('prev').disabled = i <= 0; $('next').disabled = i < 0 || i >= DATES.length - 1; $('latest').disabled = isLatest;
}

function renderTonight() {
  // mornings: the latest page is last night's, and the results run adds tonight's games
  const today = todayET(), T = DATA.date === LATEST && DATA.date < today && LATEST_SITE?.tonight?.date === today ? LATEST_SITE.tonight : null;
  const G = T ? T.games : DATA.date === today ? (DATA.games || []) : [];
  $('tonight-sec').hidden = !G.length;
  if (!G.length) return;
  const b2b = G.flatMap(g => g.b2b || []);
  $('tonight-h').textContent = T ? "Tonight's games" : `${G.length} game${G.length === 1 ? '' : 's'} today`;
  $('tonight-sub').textContent = (T ? 'Bets post around noon ET.' : '') + (b2b.length ? ` On a back-to-back (players skipped): ${b2b.join(', ')}.` : '');
  $('tonight').innerHTML = G.map(g => `<div class="game"><span>${esc(g.away)} at ${esc(g.home)}</span><span>${esc(g.tip || '')}</span></div>`).join('');
}

function renderSeason() {
  const live = seasonOf(LATEST || todayET()), L = SITE_LEDGER.filter(b => seasonOf(b.date) === live);
  const cells = [...MODELS.map(M => ({ m: M.m, name: M.name, t: sum(L.filter(b => marketOf(b) === M.m)) })), { m: 'all', name: 'All models', t: sum(L) }];
  $('season-sub').textContent = `${live}, every bet at the noon price${L.some(b => b.corrected) ? ' (Nov 7 and 8 as re-made after a model fix)' : ''}.`;
  $('season').innerHTML = cells.map(c => `<a class="scell" href="results.html" data-f="${c.m}" style="--mc:var(--m-${c.m})">
    <span class="t"><i class="mdot"></i>${c.name}</span>
    <span class="u ${c.t.n ? cls(c.t.units) : 'muted'}">${c.t.n ? sgn(c.t.units) + 'u' : '–'}</span>
    <span class="k">${c.t.n ? `${c.t.wins}–${c.t.losses} · ${sgn(c.t.roi * 100)}% return` : 'no settled bets yet'}</span></a>`).join('');
  $('season').querySelectorAll('.scell').forEach(a => a.onclick = () => NL.store.set('bb-filter', a.dataset.f));
}

/* ---------- live: ESPN box scores in the browser while the latest day's bets are being played ----------
   Display only. The 9 AM results run grades the bets for the record. ESPN allows cross-site requests. */
const ESPN = 'https://site.web.api.espn.com/apis/site/v2/sports/basketball/nba';   // this host answers browsers (site.api refuses some)
const ESPN_TEAM = { GSW: 'GS', NOP: 'NO', NYK: 'NY', SAS: 'SA', UTA: 'UTAH', WAS: 'WSH' };
const STAT_KEY = { points: 'points', rebounds: 'rebounds', assists: 'assists' };
const liveKey = p => `${marketOf(p)}|${p.player}|${p.side}`;
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[.'’]/g, '')
  .replace(/\b(jr|sr|ii|iii|iv)\b/g, '').replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
let LIVE_TIMER = null, LIVE_FINAL = {}, LIVE_ON = false;

const liveWanted = () => DATA && DATA.date === LATEST && (DATA.picks || []).some(p => !settled(result(p)?.result));

async function liveTick() {
  if (!liveWanted()) return stopLive();
  if (document.visibilityState === 'hidden') return;              // resumes on the next tick when the tab is back
  try {
    const sb = await (await fetch(`${ESPN}/scoreboard?dates=${DATA.date.replaceAll('-', '')}`, { cache: 'no-store' })).json();
    const events = (sb.events || []).map(e => ({ id: e.id, state: e.status?.type?.state, detail: e.status?.type?.shortDetail || '',
      teams: e.competitions?.[0]?.competitors?.map(c => c.team?.abbreviation) || [] }));
    const eventFor = p => { const t = ESPN_TEAM[p.team] || p.team; return events.find(e => e.teams.includes(t)); };
    const picks = DATA.picks || [], need = [...new Set(picks.map(eventFor).filter(e => e && e.state !== 'pre').map(e => e.id))];
    const boxes = {};
    await Promise.all(need.map(async id => {
      const e = events.find(x => x.id === id);
      if (LIVE_FINAL[id]) { boxes[id] = LIVE_FINAL[id]; return; }
      const d = await (await fetch(`${ESPN}/summary?event=${id}`, { cache: 'no-store' })).json();
      const players = {};
      for (const team of d.boxscore?.players || []) for (const blk of team.statistics || []) for (const a of blk.athletes || []) {
        const st = a.stats && a.stats.length ? Object.fromEntries((blk.keys || []).map((k, i) => [k, a.stats[i]])) : null;
        players[norm(a.athlete?.displayName)] = { st, dnp: !st || a.didNotPlay, reason: a.reason || '' };
      }
      boxes[id] = players;
      if (e.state === 'post') LIVE_FINAL[id] = players;                // a final box score won't change
    }));
    for (const p of picks) {
      const row = document.querySelector(`.brow[data-key="${CSS.escape(liveKey(p))}"]`);
      if (!row || settled(result(p)?.result)) continue;
      const e = eventFor(p), tag = row.querySelector('.livetag'), rs = row.querySelector('.rs'), unit = MODEL[marketOf(p)].unit;
      if (!e || e.state === 'pre') { tag.hidden = true; continue; }
      const pl = boxes[e.id]?.[norm(p.player)];
      if (!pl) { tag.hidden = false; tag.textContent = `${e.detail} · no box score line yet`; continue; }
      if (pl.dnp) {
        tag.hidden = false; tag.textContent = e.state === 'post' ? `Didn't play${pl.reason ? ` (${pl.reason.toLowerCase()})` : ''}` : `${e.detail} · hasn't played`;
        if (e.state === 'post') rs.innerHTML = '<span class="pill other">DNP · void</span>';
        continue;
      }
      const v = +pl.st[STAT_KEY[marketOf(p)]] || 0, min = pl.st.minutes || '0', over = p.side === 'OVER';
      const decided = v > p.line;                                       // an over that's cleared has won; an under that's gone over has lost
      const state = e.state === 'post' ? (over ? (v > p.line ? 'win' : 'loss') : (v < p.line ? 'win' : 'loss')) : decided ? (over ? 'win' : 'loss') : 'live';
      tag.hidden = false;
      tag.innerHTML = `<b>${v} ${unit}</b> · ${esc(min)} min · ${esc(e.state === 'post' ? 'Final' : e.detail)}`;
      rs.innerHTML = state === 'live'
        ? `<span class="pill live"><i></i>Live</span><span class="small">${over ? `needs ${Math.floor(p.line) + 1 - v} more` : `${Math.floor(p.line) - v} to spare`}</span>`
        : `<span class="pill ${state}">${state === 'win' ? (e.state === 'post' ? 'Won' : 'Hit') : 'Lost'}</span><span class="small">${e.state === 'post' ? 'final · official at 9 AM' : 'decided'}</span>`;
    }
    $('night').innerHTML = `<span class="small">Live from ESPN box scores, updated ${new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}. Official results the next morning.</span>`;
    if (picks.every(p => { const e = eventFor(p); return e && e.state === 'post'; })) stopLive();
  } catch (e) { /* a missed tick is fine: the next one tries again */ }
}
function startLive() { if (LIVE_ON || !liveWanted()) return; LIVE_ON = true; liveTick(); LIVE_TIMER = setInterval(liveTick, 120000); }
function stopLive() { LIVE_ON = false; clearInterval(LIVE_TIMER); LIVE_TIMER = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && LIVE_ON) liveTick(); });

async function show(date) {
  try {
    DATA = date && date !== LATEST ? await getJSON(`history/${date}.json`) : LATEST_SITE;
    history.replaceState(null, '', !date || DATA.date === LATEST ? location.pathname : '#' + date);
    renderHead(); renderBets(); renderTonight();
    stopLive(); LIVE_FINAL = {}; startLive();
  } catch (e) { $('banner').innerHTML = `<div class="banner">Couldn't load that day (${esc(e.message)}).</div>`; }
}

(async () => {
  try { DATES = await getJSON('history/index.json'); } catch (e) { DATES = []; }
  try { LATEST_SITE = await getJSON('picks.json'); LATEST = LATEST_SITE.date; } catch (e) { $('banner').innerHTML = `<div class="banner">Couldn't load the data.</div>`; return; }
  LEDGER = LATEST_SITE.record?.ledger || [];            // the posted bets, results as of now (each day's rows)
  SITE_LEDGER = LATEST_SITE.record?.site_ledger || LEDGER;   // the season record (the Results page and the X update use it)
  const boardLink = () => { const f = getFilter(); $('board-link').href = f === 'all' ? 'points.html' : MODEL[f].page; };
  filterSeg($('filter'), () => { renderBets(); boardLink(); if (LIVE_ON) liveTick(); });
  boardLink();
  statePicker($('state-sel'), () => renderBets());
  renderSeason();
  await show(location.hash.slice(1) || null);
  $('prev').onclick = () => show(DATES[DATES.indexOf(DATA.date) - 1]);
  $('next').onclick = () => show(DATES[DATES.indexOf(DATA.date) + 1]);
  $('latest').onclick = () => show(null);
})();
</script>
</body>
</html>
